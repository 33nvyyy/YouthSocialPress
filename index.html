<style data-static>
/* Layout: full-bleed rounded hero with story slider, category cards, dark newsletter band, featured grid + editor sidebar, searchable archive. Brand teal/navy/gold on a clean neutral ground. */
:root{--bg:#D5D3CC;--fg:#19350C;--soft:#406768;--line:rgba(25,53,12,.18);--card:#e8e6df;--accent:#687D31;--gold:#D5D3CC;--ink:#19350C;--band:#19350C;--bandfg:#D5D3CC;--bandsoft:#6FA9BB;--disp:"Outfit",system-ui,sans-serif;--body:"Figtree",system-ui,sans-serif}

:root[data-theme="dark"]{color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:400 1rem/1.6 var(--body);overflow-x:hidden}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--disp);margin:0;line-height:1.12;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:600}
p{margin:0}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.in{width:100%;max-width:1120px;margin-left:auto;margin-right:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sec{padding-top:72px}
.pill{display:inline-flex;align-items:center;gap:8px;font:600 .85rem var(--body);padding:.6rem 1.1rem;border-radius:99px;background:#fff;color:#06242F;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:transform .2s,box-shadow .2s}
.pill:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.18)}
.pill.o{background:transparent;color:var(--fg);border-color:var(--line)}
.pill.g{background:var(--gold);color:#06242F}
.pill.danger{color:#C0392B;border-color:rgba(192,57,43,.4)}
.chip{display:inline-block;background:#fff;color:#06242F;font:600 .75rem var(--body);padding:3px 11px;border-radius:99px}
.chip.s{background:var(--card);color:var(--fg)}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:24px}
.cv{position:absolute;inset:0}
.cv svg,.cv img{width:100%;height:100%;object-fit:cover;display:block}

/* hero */
.hero{position:relative;min-height:540px;border-radius:0 0 32px 32px;overflow:hidden;color:#fff;background:#06242F;display:flex;flex-direction:column;isolation:isolate}
.hbg{position:absolute;inset:0;z-index:-2;opacity:0;transition:opacity .9s}
.hbg.on{opacity:1}

.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:18px;padding-bottom:18px}
.logo{display:flex;align-items:center;gap:9px;font:600 1.1rem var(--disp)}
.logo b{width:24px;height:24px;border-radius:50%;background:conic-gradient(#D9A441,#2CA8A0,#0A3A52,#D9A441)}
.links{display:flex;gap:4px;font-size:.88rem}
.links a{padding:6px 12px;border-radius:99px;opacity:.92}
.links a:hover{background:rgba(255,255,255,.14)}

.hwrap{margin-top:auto;padding-bottom:84px}
.hbody{max-width:680px}
.hbody>*{animation:up .7s cubic-bezier(.2,.9,.3,1) both}

.dev{perspective:900px}

.scr .shot{position:relative;aspect-ratio:16/10}
.scr .shot::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(6,36,47,.9))}
.scr .cap{position:absolute;left:14px;right:14px;bottom:12px;z-index:2;font:600 clamp(.8rem,1.6vw,1.05rem)/1.25 var(--disp);color:#fff}

/* featured */
.ft{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:28px}
@media(max-width:860px){.ft{grid-template-columns:1fr}}
.big{position:relative;border-radius:26px;overflow:hidden;min-height:400px;color:#fff;display:flex;align-items:flex-end;padding:26px;background:#06242F}
.big::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(6,36,47,.9))}
.big .bt{position:relative;z-index:2;max-width:520px}
.big h3{font-size:clamp(1.5rem,3vw,2.2rem);font-weight:600;padding-top:10px}

.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-top:16px}

.rbody h3{font-size:1.4rem;padding-top:10px}
.racts{display:flex;gap:10px;flex-wrap:wrap;padding-top:30px}
.rmore{padding-top:56px}
.rmore h2{padding-bottom:20px}
.panel{background:var(--bg);color:var(--fg);max-width:720px;margin:max(16px,4vh) auto;border-radius:24px;padding:24px max(18px,3vw) 28px;display:flex;flex-direction:column;gap:16px;width:calc(100% - 24px)}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:1.2rem;cursor:pointer}

.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.fab{position:fixed;z-index:90;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
